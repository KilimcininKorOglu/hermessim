// HermesSIM Mac service messages, v1. MIT licensed (see LICENSE) so the GPL host and the
// proprietary Mac app can both compile it. The phone clients speak protocol 2 (v2/); the Mac keeps
// these messages on its own GATT service until it moves to protocol 2. Service layout: README.md.
syntax = "proto3";

package hermessim.v1;

option java_package = "com.keremgok.hermessim.protocol.v1";
option java_multiple_files = true;
option swift_prefix = "SR";

// A device on the host's hotspot, as the Mac's status lists it.
message Hotspot {
  message Client {
    string name = 1;             // the device's own name where the host can read it, else empty
    string mac = 2;
    string ip = 3;               // its IPv4 address on the hotspot; empty in MacStatus.blocked
    int64 down = 4;              // bytes to the device since the hotspot came on, where the host counts them
    int64 up = 5;                // bytes from the device since the hotspot came on
  }
}

// The Mac service's characteristics carry these, each value one serialised message.
// Status (read, notify): what the Mac shows and decides on. A notification too long for the link carries no value: the
// Mac reads the status.
message MacStatus {
  State state = 1;
  string ssid = 2;
  int32 frequency_mhz = 3;       // 0 = unknown
  string gateway = 4;            // the hotspot's own IPv4 address while on
  int32 battery_percent = 5;
  int32 signal_level = 6;        // 0..4, the host's mobile signal
  string host_name = 7;
  bool controllable = 8;         // the host can switch its hotspot now
  bool paused_for_call = 9;
  bool off_when_unused = 10;     // understands MacCommand.off_when_unused_s
  bool limit_reached = 11;       // the monthly data limit is used up: don't ask for the hotspot
  bool texts = 12;               // this Mac may read the texts characteristic
  bool charging = 13;            // the host phone is charging
  int32 devices = 14;            // devices on the hotspot now
  bool control = 15;             // this Mac may write MacControl
  bool host_actions = 16;        // the host reconnects and restarts on request
  // Filled only for a Mac with control:
  repeated MacLine lines = 17;   // the host's SIMs, for the data line choice
  repeated Hotspot.Client clients = 18;  // devices on the hotspot
  repeated Hotspot.Client blocked = 19;  // devices cut off the internet
  enum State { OFF = 0; STARTING = 1; ON = 2; FAILED = 3; }
}

message MacLine {
  int32 slot = 1;
  string name = 2;               // the operator's name
  bool enabled = 3;
  bool default_data = 4;         // carries mobile data and the hotspot
}

// Control (write with response, only for a Mac with control): one change. A Mac without control gets
// GATT_INSUFFICIENT_AUTHORIZATION; a restart or reconnect during a call gets the application error 0x80; anything else
// the host refuses gets GATT_FAILURE.
message MacControl {
  oneof what {
    int32 data_slot = 1;         // make this line the data line
    HostAction.Action host_action = 2;
    SetHotspotBlock block = 3;
  }
}

// Reconnect the host's network (airplane mode on for 5 s, then off) or restart the host phone. Refused during a call.
message HostAction {
  Action action = 1;
  enum Action { ACTION_UNSPECIFIED = 0; RECONNECT_NETWORK = 1; REBOOT = 2; }
}

// Cut a device off the hotspot's internet (it stays connected) or let it back. Matched on the MAC address; at most 32
// blocked devices. `name` is kept for the list (the device may not be connected later).
message SetHotspotBlock {
  string mac = 1;
  bool blocked = 2;
  string name = 3;
}

// Command (write): turn the hotspot on or off; off_when_unused_s > 0 turns it off when nothing used it that long.
message MacCommand {
  bool on = 1;
  int32 off_when_unused_s = 2;
}

// Secret (read): the hotspot's passphrase, kept out of the status notifications.
message MacSecret { string passphrase = 1; }

// Texts (read, notify): the texts of the last 10 minutes, newest first, at most 5, the value at most 512 bytes (the
// oldest drop first; a lone text too long is cut at its end). A notification carries no value: the Mac reads.
message MacTexts { repeated MacText texts = 1; }

message MacText {
  string id = 1;                 // the text's id on the host
  string sender = 2;             // the sender's number in E.164 where the host could normalise it, else as received
  string body = 3;
  int64 at_ms = 4;               // when the host received it
}

// Reply (write, prepared write allowed): a Mac that may read the texts answers a text it was shown. The host sends
// `body` to that text's sender on the line the text came in on; a text no longer in the texts value (older than 10
// minutes), an empty body or one over 500 bytes is refused.
message MacReply {
  string text_id = 1;            // MacText.id
  string body = 2;
}
