// The rules that this schema cannot say (frames, credit, resume, pairing) are in SPEC.md.
syntax = "proto3";

package hermessim.v2;

option java_package = "com.keremgok.hermessim.wire";
option java_multiple_files = true;
option swift_prefix = "HW";

// One message of the control channel. A message travels in one or more frames (SPEC.md "Frames").
message Packet {
  oneof kind {
    Hello hello = 1;
    Welcome welcome = 2;
    Refuse refuse = 3;
    Request request = 4;
    Reply reply = 5;
    State state = 6;
    Event event = 7;
    EventAck event_ack = 8;
    ReplayEnd replay_end = 9;
    PairStart pair_start = 10;
    PairOffer pair_offer = 11;
    PairProof pair_proof = 12;
    Bye bye = 13;
  }
}

// ---------------------------------------------------------------- session

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_PHONE = 1;   // the paired phone: every request
  ROLE_MAC = 2;     // a Mac the phone allowed: the requests its grants name
}

// Bits of Hello.features and Welcome.features. A side uses a feature only when both sides set its bit.
enum Feature {
  FEATURE_UNSPECIFIED = 0;
  FEATURE_USSD = 1;
  FEATURE_HOST_ACTIONS = 2;
  FEATURE_CALL_RULES = 3;
  FEATURE_NETWORK_MODE = 4;
  FEATURE_HOTSPOT_CALL_PAUSE = 5;
  FEATURE_AUTO_UPDATE = 6;
  FEATURE_MAC_PEERS = 7;
}

// The first message of a link, from the side that connected.
message Hello {
  uint32 min_version = 1;         // the lowest and highest protocol version this side speaks
  uint32 max_version = 2;
  uint64 features = 3;            // bit n is set when this side has Feature n
  Role role = 4;
  bytes install_id = 5;           // 16 random bytes made at install: the identity the host pins
  string app_version = 6;
  string device_model = 7;
  Resume resume = 8;              // absent on the first link of a session
  StateMark state_mark = 9;       // the last State this side applied, absent when it has none
  uint64 text_cursor = 10;        // the highest text seq this side stored, 0 for none
  uint64 call_cursor = 11;        // the highest call seq this side applied, 0 for none
}

// Asks the host to go on with a session after the link came back (SPEC.md "Resume").
message Resume {
  uint32 session_id = 1;
  uint32 received = 2;            // how many of the host's messages arrived whole
}

message StateMark {
  uint32 epoch = 1;               // Welcome.epoch of the host run the seq belongs to
  uint32 seq = 2;
}

// The host's answer to an accepted Hello.
message Welcome {
  uint32 version = 1;             // the version both sides speak from here on
  uint64 features = 2;
  uint32 session_id = 3;
  bool resumed = 4;               // true: the counters of Resume go on; false: a new session
  uint32 received = 5;            // with resumed: how many of this side's messages arrived whole
  uint32 epoch = 6;               // changes each time the host app starts
  HostInfo host = 7;              // what never changes while the host app runs
  uint32 audio_psm = 8;           // the L2CAP channel of call audio, 0 over the internet
}

message HostInfo {
  string app_version = 1;
  string device_model = 2;
  string firmware = 3;
  uint32 max_blocked_numbers = 5;
  uint32 max_mac_peers = 6;
  uint32 max_blocked_clients = 7; // hotspot devices
}

// The host's answer to a Hello it does not accept. The link stays up for a new Hello or for pairing.
message Refuse {
  Code code = 1;
  uint32 min_version = 2;         // with CODE_VERSION: what the host speaks
  uint32 max_version = 3;
  uint32 tries_left = 4;          // with CODE_PAIRING_WRONG: proofs left before the host makes a new code
}

enum ByeReason {
  BYE_REASON_UNSPECIFIED = 0;
  BYE_REASON_RETIRED = 1;         // this phone stopped being a host: the peer forgets it
}

// The host ends the pairing by itself. Nothing follows on the link.
message Bye {
  ByeReason reason = 1;
}

// ---------------------------------------------------------------- pairing (SPEC.md "Pairing")

message PairStart {
  bytes public_key = 1;           // the phone's X25519 key for this attempt
}

message PairOffer {
  bytes public_key = 1;           // the host's X25519 key for this attempt
  bytes salt = 2;                 // 16 random bytes
  uint32 tries_left = 3;
}

message PairProof {
  bytes proof = 1;                // HMAC-SHA-256 over the transcript and the code the host shows
}

// ---------------------------------------------------------------- requests and replies

// Every result of a request, a refused Hello and a refused pairing. Values are never reused.
enum Code {
  CODE_UNSPECIFIED = 0;
  CODE_OK = 1;
  CODE_VERSION = 2;               // no protocol version in common
  CODE_NOT_PAIRED = 3;
  CODE_PAIRING_CLOSED = 4;        // the host shows no pairing code now
  CODE_PAIRING_WRONG = 5;         // wrong proof; Refuse.tries_left says how many are left
  CODE_NOT_ALLOWED = 6;           // this role may not make the request
  CODE_UNKNOWN_REQUEST = 7;       // the host does not know the request
  CODE_BAD_VALUE = 8;             // args[0] = the field number of the value
  CODE_TOO_OLD = 9;               // Request.age_ms is above what the request allows
  CODE_BUSY = 10;                 // the same kind of request is still running
  CODE_FAILED = 11;               // the phone system refused; args[0] = its error number when it gave one
  CODE_IN_CALL = 12;              // not possible during a call
  CODE_NO_SUCH_CALL = 13;
  CODE_NO_SUCH_LINE = 14;
  CODE_LINE_OFF = 15;
  CODE_NOT_OFFERED = 16;          // this host does not offer the setting or the value
  CODE_NO_SERVICE = 17;
  CODE_CALL_TEST_NEEDED = 18;     // calls are not relayed until the call test passes
  CODE_ESIM_STAYS_ON = 19;        // this eSIM cannot be turned off
  CODE_WRONG_PIN = 20;            // args[0] = tries left, -1 when the modem does not say
  CODE_HOTSPOT_ON = 21;           // not possible while the hotspot is on
  CODE_NO_AUDIO_PROFILE = 22;     // this host has no audio routes: the call test cannot run
  CODE_LIMIT_REACHED = 23;        // a list is full; args[0] = its size
  CODE_BLUETOOTH_ONLY = 24;       // the request carries a secret and came over the internet
  CODE_UPDATE_NONE = 25;          // no update to install
  CODE_UPDATE_FAILED = 26;        // args[0] = an UpdateFault
  CODE_CALL_TEST_FAILED = 27;     // args[0] = a CallTestFault
  CODE_TIMEOUT = 28;              // the network did not answer (USSD)
  CODE_WIFI_NOT_FOUND = 29;       // no network with that name is in range
  CODE_WIFI_JOIN_FAILED = 30;     // wrong passphrase, or the network refused
  CODE_CARRIES_LINK = 31;         // turning it off would cut the link the request came over
  CODE_NETWORK_REFUSED = 32;      // the mobile network said no (USSD)
}

message Request {
  uint32 id = 1;                  // from 1, unique in the session; the Reply carries it
  uint32 age_ms = 2;              // how long ago the user asked, set again on each send
  oneof op {
    GetState get_state = 10;
    Dial dial = 11;
    CallControl call_control = 12;
    SendTones send_tones = 13;
    SendText send_text = 14;
    RunUssd run_ussd = 15;
    SetLine set_line = 16;
    UnlockLine unlock_line = 17;
    SetDataLine set_data_line = 18;
    SetHotspot set_hotspot = 19;
    SetHotspotSetup set_hotspot_setup = 20;
    SetHotspotClient set_hotspot_client = 21;
    GetHotspotSecret get_hotspot_secret = 22;
    SetMobileData set_mobile_data = 23;
    SetHostWifi set_host_wifi = 24;
    SaveWifi save_wifi = 25;
    ForgetWifi forget_wifi = 26;
    SetBox set_box = 27;
    SetCallRules set_call_rules = 28;
    HostAction host_action = 29;
    UpdateControl update_control = 30;
    GetLog get_log = 31;
    SetRemote set_remote = 32;
    OpenAudioPath open_audio_path = 33;
    CallTestCheck call_test_check = 34;
    OpenPeerWindow open_peer_window = 35;
    SetPeer set_peer = 36;
    CallTestVerdict call_test_verdict = 37;
    ScanWifi scan_wifi = 38;
    SetPushKey set_push_key = 39;
    CloseAudioPath close_audio_path = 40;
    ForgetHost forget_host = 41;
  }
}

message Reply {
  uint32 id = 1;
  Code code = 2;
  repeated sint64 args = 3;       // the numbers a Code names
  oneof result {
    TextQueued text = 11;
    UssdAnswer ussd = 12;
    HotspotSecret hotspot_secret = 13;
    LogPart log = 14;
    AudioPath audio_path = 15;
    LineLockNow line_lock = 16;
    CallTestReading call_test = 17;
    WifiList wifi_list = 18;
  }
}

// Asks for whole groups again. An empty list means every group.
message GetState {
  repeated uint32 groups = 1;     // field numbers of State
}

// The phone forgets this host. The host answers, then forgets the phone, its keys and its Bluetooth bond.
message ForgetHost {}

// ---------------------------------------------------------------- calls

// The reply says only that the host started to dial. The call's events repeat client_ref.
message Dial {
  string number = 1;
  optional uint32 line = 2;       // absent: the phone system's default line for calls
  bytes client_ref = 3;           // 16 bytes the phone chose
  bool test = 4;                  // the call of the call test: relayed although the test has not passed
}

enum CallVerb {
  CALL_VERB_UNSPECIFIED = 0;
  CALL_VERB_ANSWER = 1;
  CALL_VERB_END = 2;              // rejects a ringing call, ends any other
  CALL_VERB_HOLD = 3;
  CALL_VERB_RESUME = 4;
}

message CallControl {
  uint64 call = 1;
  CallVerb verb = 2;
}

// Keypad tones, played in order on the call.
message SendTones {
  uint64 call = 1;
  string digits = 2;              // 0-9, *, #, A-D
  uint32 tone_ms = 3;             // 0: the host's default length
  uint32 gap_ms = 4;
}

enum CallPhase {
  CALL_PHASE_UNSPECIFIED = 0;
  CALL_PHASE_RINGING = 1;         // incoming, not answered
  CALL_PHASE_DIALING = 2;         // outgoing, not answered
  CALL_PHASE_ACTIVE = 3;
  CALL_PHASE_HELD = 4;
  CALL_PHASE_ENDED = 5;
}

enum CallEnd {
  CALL_END_UNSPECIFIED = 0;
  CALL_END_LOCAL = 1;             // ended from this side
  CALL_END_REMOTE = 2;
  CALL_END_MISSED = 3;
  CALL_END_REJECTED = 4;
  CALL_END_BUSY = 5;
  CALL_END_FAILED = 6;
}

// The state of one call. A new CallState of the same call replaces the one before.
message CallState {
  uint64 call = 1;                // never used again by this host
  CallPhase phase = 2;
  bool incoming = 3;
  string number = 4;              // as the network gave it or as it was dialled; empty for a hidden number
  optional uint32 line = 5;       // absent: the host does not know the line
  uint64 phase_since_ms = 6;      // host wall clock when the call entered this phase; kept in a replay
  CallEnd end = 7;                // with CALL_PHASE_ENDED
  bytes client_ref = 8;           // Dial.client_ref of an outgoing call
  string number_e164 = 9;         // the number in E.164, empty when the host cannot tell
  bool far_end_rings = 10;        // with CALL_PHASE_DIALING: the other phone rings now
  bool far_end_known = 11;        // with CALL_PHASE_DIALING: this host reports far_end_rings for this call
}

// During the call of the call test: what the host measured since the call's audio started.
message CallTestCheck {}

message CallTestReading {
  bool in_call = 1;
  uint32 silenced_controls = 2;
  uint32 captured_frames = 3;
  uint32 voiced_frames = 4;
  uint32 sent_frames = 5;
  uint32 played_frames = 6;
  uint32 peak = 7;
  string profile = 8;
  string profile_source = 9;
}

enum HostSound {
  HOST_SOUND_UNSPECIFIED = 0;
  HOST_SOUND_SILENT = 1;
  HOST_SOUND_HEARD = 2;           // the host phone itself made sound during the call
  HOST_SOUND_NOT_CHECKED = 3;
}

// What the user said about the call of the call test. CODE_OK: the test passed and calls are relayed from now on.
message CallTestVerdict {
  bool passed = 1;
  bool heard_caller = 2;
  bool caller_heard = 3;
  bool echo = 4;
  HostSound host_sound = 5;
}

// Why a call test did not pass (CODE_CALL_TEST_FAILED).
enum CallTestFault {
  CALL_TEST_FAULT_UNSPECIFIED = 0;
  CALL_TEST_FAULT_NOT_CONFIRMED = 1;       // the user did not say it passed
  CALL_TEST_FAULT_NO_READING = 2;          // no CallTestCheck during the call
  CALL_TEST_FAULT_NO_CALLER_VOICE = 3;     // the caller's voice did not reach the host's capture path
  CALL_TEST_FAULT_NOTHING_PLAYED = 4;      // no audio from the phone was played into the call
  CALL_TEST_FAULT_CALLER_HEARD_NOTHING = 5;
  CALL_TEST_FAULT_ECHO = 6;
  CALL_TEST_FAULT_HOST_SOUND = 7;
}

// ---------------------------------------------------------------- texts

message SendText {
  bytes client_ref = 1;           // 16 bytes the phone chose; a resent request with the same ref sends nothing twice
  string to = 2;
  string body = 3;
  optional uint32 line = 4;       // absent: the phone system's default line for texts
}

message TextQueued {
  uint64 text = 1;                // the seq under which TextStatus events follow
}

message TextIn {
  string from = 1;                // as the network gave it
  string body = 2;
  optional uint32 line = 3;
  uint64 at_ms = 4;               // host wall clock when the text arrived
  string from_e164 = 5;           // empty when the host cannot tell
}

enum TextOrigin {
  TEXT_ORIGIN_UNSPECIFIED = 0;
  TEXT_ORIGIN_BUSY_REPLY = 1;     // the reply of the call rules
  TEXT_ORIGIN_MAC = 2;            // a Mac peer sent it
}

// A text the host sent that this peer did not ask for. Its TextStatus events follow under the event's seq.
message TextByHost {
  string to = 1;
  string body = 2;
  optional uint32 line = 3;
  uint64 at_ms = 4;
  TextOrigin origin = 5;
}

enum TextPhase {
  TEXT_PHASE_UNSPECIFIED = 0;
  TEXT_PHASE_QUEUED = 1;
  TEXT_PHASE_SENT = 2;            // the network took it
  TEXT_PHASE_DELIVERED = 3;       // the network reported delivery
  TEXT_PHASE_FAILED = 4;
  TEXT_PHASE_UNCONFIRMED = 5;     // the network gave no answer in time; the text may have gone
}

// Phases only move forward, with one exception: DELIVERED may follow FAILED or UNCONFIRMED when the report comes late.
message TextStatus {
  uint64 text = 1;
  bytes client_ref = 2;
  TextPhase phase = 3;
  sint32 error = 4;               // with TEXT_PHASE_FAILED: the phone system's number, 0 when it gave none
}

message RunUssd {
  optional uint32 line = 1;       // absent: the phone system's default line for texts
  string code = 2;
}

message UssdAnswer {
  string text = 1;
}

// ---------------------------------------------------------------- lines (SIMs)

enum NetworkCeiling {
  NETWORK_CEILING_UNSPECIFIED = 0;
  NETWORK_CEILING_NONE = 1;       // every network the modem has
  NETWORK_CEILING_4G = 2;
  NETWORK_CEILING_3G = 3;
}

enum LineLock {
  LINE_LOCK_UNSPECIFIED = 0;
  LINE_LOCK_OPEN = 1;
  LINE_LOCK_PIN = 2;
  LINE_LOCK_PUK = 3;
  LINE_LOCK_DEAD = 4;             // no tries left
  LINE_LOCK_NETWORK = 5;          // locked to another network
}

// One setting of one line per request: the reply then says exactly what happened to it.
message SetLine {
  uint32 line = 1;
  oneof setting {
    bool enabled = 2;
    bool roaming = 3;
    NetworkCeiling ceiling = 4;
  }
}

message UnlockLine {
  uint32 line = 1;
  string pin = 2;
  string puk = 3;                 // with a PUK lock: pin is the new PIN
}

// The line's lock after an UnlockLine, right or wrong.
message LineLockNow {
  LineLock lock = 1;
  optional uint32 tries_left = 2;
}

// Mobile data moves to this line.
message SetDataLine {
  uint32 line = 1;
}

message Line {
  uint32 line = 1;                // the SIM slot, from 0: the id every other message uses
  string carrier = 3;
  string number = 4;              // in E.164, empty when the SIM does not say
  bool enabled = 5;
  bool embedded = 6;              // an eSIM
  LineLock lock = 7;
  optional uint32 tries_left = 8; // absent: the modem does not say, or the line is not locked
  bool roaming_allowed = 9;
  bool roaming_now = 10;
  bool volte = 11;
  NetworkCeiling ceiling = 12;
  repeated NetworkCeiling ceilings = 13;   // empty: this modem cannot set one
  string country = 14;            // ISO 3166-1 alpha-2 of the SIM, lowercase
  bytes card = 15;                // 8 bytes that stay the same for this SIM card in any slot
}

// ---------------------------------------------------------------- hotspot

enum HotspotBand {
  HOTSPOT_BAND_UNSPECIFIED = 0;
  HOTSPOT_BAND_2G = 1;
  HOTSPOT_BAND_5G = 2;
  HOTSPOT_BAND_6G = 3;
  HOTSPOT_BAND_AUTO = 4;          // 2.4 or 5 GHz, the host picks
  HOTSPOT_BAND_2G_AND_5G = 5;     // both at once
}

enum HotspotSecurity {
  HOTSPOT_SECURITY_UNSPECIFIED = 0;
  HOTSPOT_SECURITY_WPA2 = 1;
  HOTSPOT_SECURITY_WPA3 = 2;
  HOTSPOT_SECURITY_WPA2_WPA3 = 3;
  HOTSPOT_SECURITY_OPEN = 4;
}

enum HotspotPhase {
  HOTSPOT_PHASE_UNSPECIFIED = 0;
  HOTSPOT_PHASE_OFF = 1;
  HOTSPOT_PHASE_STARTING = 2;
  HOTSPOT_PHASE_ON = 3;
  HOTSPOT_PHASE_PAUSED = 4;       // off for a call's audio, comes back after it
  HOTSPOT_PHASE_FAILED = 5;       // the last start failed and nothing switched it since
}

// on = false with off_when_unused_s above 0: the hotspot stays on until no device used it for that long.
message SetHotspot {
  bool on = 1;
  uint32 off_when_unused_s = 2;
}

// The hotspot's settings. An absent field stays as it is. A running hotspot starts again when a radio setting changed.
message SetHotspotSetup {
  optional string name = 1;
  optional string passphrase = 2;          // Bluetooth only
  optional HotspotBand band = 3;
  optional HotspotSecurity security = 4;
  optional bool hidden = 5;
  optional bool idle_off = 6;              // the phone system turns an idle hotspot off
  optional uint64 month_limit_bytes = 7;   // 0: no limit
  optional bool pause_in_calls = 8;
  optional uint32 idle_off_minutes = 9;
  optional bool apple_marker = 10;         // Apple devices list it as a personal hotspot
}

message SetHotspotClient {
  bytes mac = 1;                  // 6 bytes
  bool blocked = 2;
  string name = 3;                // the name the phone shows for it; kept with a blocked device
}

message GetHotspotSecret {}

// Bluetooth only.
message HotspotSecret {
  string passphrase = 1;
}

message Hotspot {
  HotspotPhase phase = 1;
  string name = 2;
  HotspotBand band = 3;
  HotspotSecurity security = 4;
  bool hidden = 5;
  bool idle_off = 7;
  uint64 month_limit_bytes = 8;
  bool limit_reached = 9;         // this month's use is at the limit
  bool pause_in_calls = 10;
  uint32 frequency_mhz = 11;      // while on, 0 when the host does not know it
  bool available = 12;            // false: this phone's hotspot cannot be read or set
  uint32 idle_off_minutes = 13;
  string gateway = 14;            // the host's own address on the hotspot while on
  bool apple_marker = 15;
}

// What this host's hotspot can do. An empty list or false means the setting cannot be changed.
message HotspotLimits {
  repeated HotspotBand bands = 1;
  repeated HotspotSecurity securities = 2;
  bool hidden_name = 4;
  bool idle_off = 5;
  bool call_pause = 6;
  bool block_clients = 7;
  bool off_when_unused = 8;
  bool apple_marker = 9;
  bool month_limit = 10;
  bool client_usage = 11;
}

// Bytes through the hotspot, both directions together unless named.
message HotspotUsage {
  uint64 session_down = 1;        // to the devices, since the hotspot came on
  uint64 session_up = 2;
  uint64 today = 3;
  uint64 month = 4;
}

message HotspotClient {
  bytes mac = 1;
  string name = 2;
  bool blocked = 3;
  bool connected = 4;
  string ip = 5;
  uint64 down_bytes = 6;          // since the hotspot came on
  uint64 up_bytes = 7;
}

// The devices on the hotspot and the blocked ones.
message HotspotClients {
  repeated HotspotClient clients = 1;
}

// ---------------------------------------------------------------- host settings

message SetMobileData {
  bool on = 1;
}

// The host joins a saved Wi-Fi network when the phone is away.
message SetHostWifi {
  bool use_when_away = 1;
}

// Bluetooth only. The networks around the host.
message ScanWifi {}

message WifiSeen {
  string name = 1;
  bool secure = 2;
  uint32 level = 3;               // 0-4
  bool saved = 4;
}

message WifiList {
  repeated WifiSeen networks = 1;
}

// Bluetooth only. The host saves the network and joins it once to prove the passphrase.
message SaveWifi {
  string name = 1;
  string passphrase = 2;          // empty for an open network
}

// Bluetooth only.
message ForgetWifi {
  uint32 id = 1;                  // SavedWifi.id
}

message SavedWifi {
  uint32 id = 1;
  string name = 2;
}

// Why the host's own Wi-Fi is on or off now.
enum WifiRule {
  WIFI_RULE_UNSPECIFIED = 0;
  WIFI_RULE_NOT_PAIRED = 1;       // left alone
  WIFI_RULE_IN_CALL = 2;          // left alone until the call ends
  WIFI_RULE_HOTSPOT = 3;          // off: the hotspot is on
  WIFI_RULE_SETUP = 4;            // on for a scan or a join
  WIFI_RULE_PHONE_NEAR = 5;       // off: the phone is on Bluetooth
  WIFI_RULE_AWAY = 6;             // on: the phone is away and use_when_away is set
  WIFI_RULE_SETTING_OFF = 7;      // off: the phone is away and use_when_away is not set
}

message HostWifi {
  bool use_when_away = 1;
  string joined = 2;              // the network the host is on, empty for none
  repeated SavedWifi saved = 3;
  bool on = 4;
  WifiRule rule = 5;
}

// The box settings. An absent field stays as it is.
message SetBox {
  optional bool box_mode = 1;
  optional uint32 charge_limit = 2;        // percent, 50 to 100; 100: no limit
}

// What the charge limit does now.
enum ChargeState {
  CHARGE_STATE_UNSPECIFIED = 0;   // the host could not read it
  CHARGE_STATE_NOT_LIMITING = 1;
  CHARGE_STATE_CHARGING = 2;      // below the limit
  CHARGE_STATE_HELD = 3;
  CHARGE_STATE_DRAINING = 4;      // above the limit
  CHARGE_STATE_STUCK = 5;         // the phone system keeps undoing the limit
}

message Power {
  optional uint32 battery = 1;    // percent
  optional bool charging = 2;
  optional bool box_mode = 3;
  optional uint32 charge_limit = 4;
  optional ChargeState charge_state = 5;
  optional bool box_paused = 6;            // box mode is on but its settings are not applied now
  optional uint64 box_paused_until_ms = 7; // host wall clock, 0 when not paused
  optional bool charge_limit_offered = 8;
  optional bool call_screen_hidden = 9;    // the host is the phone app: no call screen lights it up
}

enum Uplink {
  UPLINK_UNSPECIFIED = 0;
  UPLINK_NONE = 1;
  UPLINK_MOBILE = 2;
  UPLINK_WIFI = 3;
  UPLINK_OTHER = 4;
}

message Network {
  bool mobile_data = 1;
  Uplink uplink = 2;
  optional uint32 data_line = 3;  // the line that carries mobile data
  string uplink_name = 7;         // the carrier or the Wi-Fi network
}

// The bars of each line. It has a group of its own (SPEC.md "State").
message Signal {
  repeated uint32 bars = 1;       // 0-4, in the order of Lines.lines
}

message Lines {
  repeated Line lines = 1;
}

message SetCallRules {
  CallRules rules = 1;
}

message CallRules {
  repeated string blocked = 1;
  bool block_hidden = 2;
  string busy_text = 3;           // what a text gets as a reply while busy
  bool busy = 4;
}

enum HostVerb {
  HOST_VERB_UNSPECIFIED = 0;
  HOST_VERB_REGISTER_AGAIN = 1;   // airplane mode for 5 s
  HOST_VERB_RESTART = 2;
}

message HostAction {
  HostVerb verb = 1;
}

enum UpdateVerb {
  UPDATE_VERB_UNSPECIFIED = 0;
  UPDATE_VERB_CHECK = 1;
  UPDATE_VERB_INSTALL = 2;
  UPDATE_VERB_LATER = 3;          // not before a day from now
  UPDATE_VERB_AUTO_ON = 4;
  UPDATE_VERB_AUTO_OFF = 5;
}

message UpdateControl {
  UpdateVerb verb = 1;
}

enum UpdatePhase {
  UPDATE_PHASE_UNSPECIFIED = 0;
  UPDATE_PHASE_IDLE = 1;          // the host runs the newest version it knows
  UPDATE_PHASE_AVAILABLE = 2;     // a newer version exists and is not downloaded
  UPDATE_PHASE_DOWNLOADING = 3;
  UPDATE_PHASE_READY = 4;         // downloaded and verified
  UPDATE_PHASE_INSTALLING = 5;
  UPDATE_PHASE_FAILED = 6;
  UPDATE_PHASE_CHECKING = 7;
}

enum UpdateFault {
  UPDATE_FAULT_UNSPECIFIED = 0;
  UPDATE_FAULT_UNREACHABLE = 1;   // the update server did not answer
  UPDATE_FAULT_NO_PACKAGE = 2;
  UPDATE_FAULT_DOWNLOAD = 3;
  UPDATE_FAULT_WRONG_PACKAGE = 4; // not a host package, or not the version that was offered
  UPDATE_FAULT_WRONG_KEY = 5;     // signed with another key than this installation
  UPDATE_FAULT_ROOT_REFUSED = 6;
  UPDATE_FAULT_INSTALL = 7;
}

message UpdateText {
  string language = 1;            // ISO 639-1
  string text = 2;
}

message UpdateNote {
  string version = 1;
  repeated UpdateText texts = 2;
}

message Update {
  UpdatePhase phase = 1;
  string version = 2;             // the newer version, empty when there is none
  repeated UpdateNote notes = 3;
  bool automatic = 4;
  string current_version = 5;
  uint32 current_code = 6;
  uint32 code = 7;                // of the newer version
  UpdateFault fault = 8;          // why the last check, download or install did not work
  uint64 later_until_ms = 9;      // host wall clock until which UPDATE_VERB_LATER holds, 0 for none
  uint64 checked_ms = 10;         // host wall clock of the last check that reached the server
}

// The host log, scrubbed. A long log comes as several replies to the one request, on the bulk stream.
message GetLog {
  uint32 max_bytes = 1;
}

message LogPart {
  string text = 1;
  bool last = 2;
  string facts_json = 3;          // in the first part: the host's facts for a report
}

enum SupportTier {
  SUPPORT_TIER_UNSPECIFIED = 0;
  SUPPORT_TIER_VERIFIED = 1;
  SUPPORT_TIER_EXPECTED = 2;
  SUPPORT_TIER_EXPERIMENTAL = 3;
  SUPPORT_TIER_NOT_YET = 4;
  SUPPORT_TIER_UNKNOWN = 5;
  SUPPORT_TIER_UNSUPPORTED = 6;
}

message Voice {
  bool relays_audio = 1;          // the call test passed on this firmware: calls carry audio
  bool can_test = 2;              // the host has audio routes for a call test
  bool passed = 3;
  uint64 passed_at_ms = 4;
  string profile = 5;             // the device profile the host uses for call audio
  string profile_source = 6;
  SupportTier support = 7;        // what the support table says about this phone
  string device_name = 8;
  string firmware = 9;
}

// ---------------------------------------------------------------- internet mode

// Hands the host the key of internet mode, or turns the mode off. Turning it on is Bluetooth only.
message SetRemote {
  bool on = 1;
  bytes room_key = 2;             // 32 bytes
}

// The key the host seals push messages with. An empty key forgets it; any other is Bluetooth only.
message SetPushKey {
  bytes key = 1;                  // 32 bytes
}

message Remote {
  bool on = 1;
  bool host_online = 2;           // the host reaches the relay
  bytes push_key_mark = 3;        // the first 8 bytes of SHA-256 of the push key the host holds, empty for none
}

// A call's audio over the internet: each side names where the other sends to.
message OpenAudioPath {
  bytes address = 2;              // 4 or 16 bytes
  uint32 port = 3;
}

message AudioPath {
  bytes address = 1;
  uint32 port = 2;
}

message CloseAudioPath {}

// The host closed the internet audio path by itself (Bluetooth took the call's audio, or the path broke).
message AudioPathClosed {}

// ---------------------------------------------------------------- Mac peers

message OpenPeerWindow {
  bool open = 1;                  // the host takes a new Mac for 120 s
}

message SetPeer {
  bytes id = 1;                   // Peer.id
  oneof change {
    bool remove = 2;
    PeerGrants grants = 3;
  }
}

message PeerGrants {
  bool texts = 1;                 // may show texts and codes
  bool control = 2;               // may change host settings
}

message Peer {
  bytes id = 1;
  string name = 2;
  PeerGrants grants = 3;
  bool connected = 4;
}

message Peers {
  repeated Peer peers = 1;
  bool window_open = 2;
  bool available = 3;             // this host can take Mac peers
}

// ---------------------------------------------------------------- state

// The groups that changed since the State before. A group that is present replaces the receiver's copy of it;
// in Power, an absent field stays as it is. A receiver that sees a gap in seq asks with GetState.
message State {
  uint32 seq = 1;                 // from 1 in each epoch, one higher with every State
  Power power = 2;
  Network network = 3;
  Lines lines = 4;
  Signal signal = 5;
  Hotspot hotspot = 6;
  HotspotClients hotspot_clients = 7;
  HostWifi wifi = 8;
  Update update = 9;
  CallRules rules = 10;
  Voice voice = 11;
  Remote remote = 12;
  Peers peers = 13;
  HotspotLimits hotspot_limits = 14;
  HotspotUsage hotspot_usage = 15;
}

// ---------------------------------------------------------------- events

enum NoticeKind {
  NOTICE_KIND_UNSPECIFIED = 0;
  NOTICE_KIND_BATTERY_LOW = 1;        // value = percent
  NOTICE_KIND_BATTERY_CRITICAL = 2;   // value = percent
  NOTICE_KIND_LINE_LOCKED = 3;
  NOTICE_KIND_DATA_LIMIT_NEAR = 4;    // value = percent of the month's limit
  NOTICE_KIND_DATA_LIMIT_REACHED = 5; // value = percent; the hotspot went off
  NOTICE_KIND_ROAMING = 6;            // value = 1 when the line's data roaming is allowed
  NOTICE_KIND_CHARGE_STUCK = 7;       // value = the charge limit
}

message Notice {
  NoticeKind kind = 1;
  optional uint32 line = 2;
  sint64 value = 3;
  uint64 at_ms = 4;
}

// Something that happened on the host. Texts and calls have seq numbers the host keeps on disk.
message Event {
  uint64 seq = 1;                 // texts and calls count apart; 0 for the kinds that have no seq
  oneof what {
    CallState call = 2;
    TextIn text_in = 3;
    TextStatus text_status = 4;
    Notice notice = 5;
    TextByHost text_by_host = 6;
    AudioPathClosed audio_path_closed = 7;
  }
}

// "I stored every text up to this seq." The host then forgets them.
message EventAck {
  uint64 texts_up_to = 1;
}

// Ends the replay after a Welcome: every call that is live now and every text above the cursor was sent.
message ReplayEnd {
  uint64 text_cursor = 1;         // the highest text seq the host has
  uint64 call_cursor = 2;
  repeated uint64 live_calls = 3; // a call the receiver holds that is not here has ended
}
